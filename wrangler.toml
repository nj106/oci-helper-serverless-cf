name = "oci-helper-serverless"
main = "dist/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[assets]
directory = "web-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# D1 数据库：Deploy 向导里点“新建数据库”会自动创建并注入 database_id；
# 也可先手动创建，再把真实 ID 填到下方（保持占位符会导致部署失败）：
#   npx wrangler d1 create oci-helper-serverless
# 表结构由 Worker 首次请求时自动 CREATE TABLE IF NOT EXISTS，无需手动跑 migration。
[[d1_databases]]
binding = "DB"
database_name = "oci-helper-serverless"
database_id = "b7440ae6-5fdd-473e-bb92-fa69f2de1005"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "LOG_HUB"
class_name = "LogHub"

[[durable_objects.bindings]]
name = "VNC_TUNNEL"
class_name = "VncTunnel"

[exports.LogHub]
type = "durable-object"
storage = "sqlite"

[exports.VncTunnel]
type = "durable-object"
storage = "sqlite"

[triggers]
crons = ["* * * * *"]
