name: Sync upstream and deploy

on:
  schedule:
    - cron: '37 2 * * *'   # 10:37 Beijing (02:37 UTC, GitHub 低负载时段)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: merge
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/Yohann0617/oci-helper-serverless-cf.git
          git fetch upstream main
          before=$(git rev-parse HEAD)
          git merge --no-edit upstream/main
          if [ "$(git rev-parse HEAD)" != "$before" ]; then
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
