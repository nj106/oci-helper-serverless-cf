name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', '.github/**']
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 3b3852aa8e649a29348c00d51c6b62cc
  D1_DATABASE_ID: aaae361d-5dba-4ffa-9180-29a122794a42
  CUSTOM_DOMAIN: oci.njcq.us.kg

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch wrangler.toml (D1 id + custom domain)
        run: |
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/${D1_DATABASE_ID}/" wrangler.toml
          grep -q "custom_domain" wrangler.toml || \
            sed -i "0,/^compatibility_flags.*/s//&\nroutes = [{ pattern = \"${CUSTOM_DOMAIN}\", custom_domain = true }]/" wrangler.toml
          grep -q "${D1_DATABASE_ID}" wrangler.toml
          cat wrangler.toml
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::缺少仓库 Secret CLOUDFLARE_API_TOKEN"; exit 1; fi
          npx --yes wrangler@4 deploy
